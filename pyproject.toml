[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "1.0.0"
description = "The ultimate Python video framework — create any video programmatically with zero bloat"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ouroboros Team"}
]
keywords = ["video", "animation", "rendering", "python", "programmatic", "motion-graphics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
audio = ["pydub>=0.25.1"]
full = ["pydub>=0.25.1", "requests>=2.28.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
ouroboros = "ouroboros.cli:main"

[project.urls]
Homepage = "https://github.com/Atum246/ouroboros"
Documentation = "https://github.com/Atum246/ouroboros#readme"
Repository = "https://github.com/Atum246/ouroboros"

[tool.setuptools.packages.find]
include = ["ouroboros*"]
